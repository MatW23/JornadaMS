services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jornada_ms
      POSTGRES_USER: jornada_ms
      POSTGRES_PASSWORD: jornada_ms
    ports:
      - "5432:5432"
    volumes:
      - jornada_ms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jornada_ms -d jornada_ms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      JORNADA_MS_ENVIRONMENT: development
      JORNADA_MS_DATABASE_URL: postgresql+psycopg://jornada_ms:jornada_ms@db:5432/jornada_ms
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  jornada_ms_postgres:
